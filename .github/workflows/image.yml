# Rebuilds and pushes the container image for an already published version,
# e.g. when the image push at the end of publish.yml failed. Does not touch
# main, tags or releases.
name: Push image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to build, without the v (e.g. 0.2.0)"
        required: true
        type: string
      latest:
        description: "Also move the latest tag"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}"
          tags="-t $image:$VERSION"
          [ "$LATEST" = "true" ] && tags="$tags -t $image:latest"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            $tags .

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push --all-tags "ghcr.io/${{ github.repository }}"
